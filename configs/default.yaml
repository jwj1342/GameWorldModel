# 通用默认配置。所有选型与阈值都在这里，代码里不写魔法数。
frames:
  sample_fps: 4            # 抽帧率
  max_seconds: 60
  keyframes: 12            # 送给 VLM 的关键帧数
  keyframe_max_side: 768   # 关键帧长边像素
  geometry_frames: 48      # 几何后端使用的帧数上限
  geometry_width: 518      # VGGT 输入宽
perception:
  geometry_backend: vggt          # vggt | static | gt（ViPE 与 SAM 3.1 见 docs/status.md 的待办）
  geometry_fallbacks: [static]
  segmentation_backend: grounded_sam2   # grounded_sam2 | gt
  segmentation_fallbacks: [none]   # 检测器崩了也要出包，退化成只有静态结构的场景
  max_objects: 8
  min_track_frame_frac: 0.0  # 被看到的帧数低于这个比例的轨迹直接丢掉。0 表示不过滤。
                             # 只被看到几帧的轨迹基本是噪声（运动估计成功率 0%），
                             # 而它们把物体精确率压得很低。合适的值用小批量真值指标定。
  color_min_pixels: 4             # 最少实测像素；缺图/缺mask时不猜颜色
  color_aspect_tolerance: 0.02     # 相对长宽比容差，允许几何模型patch尺寸取整
  grounding_box_threshold: 0.25
  grounding_text_threshold: 0.2
  detection_keyframes: 6          # 在 6 个均匀关键帧上检测后关联。实测这是召回最大的杠杆：
                                  # 同一段视频 1 帧检出 9 个物体、画面覆盖 0.23，6 帧检出 62 个、
                                  # 覆盖 0.53，代价是感知从 50 秒涨到 108 秒。再降阈值能到 0.78，
                                  # 但资产命中率从 0.74 掉到 0.58（检出一堆对不上类别的东西），
                                  # 耗时翻到 241 秒，所以阈值保持不动。
  association:                    # 类别／重叠／空间／时间关联；保留身份候选
    max_frame_gap: 24
    max_bbox_center_distance_ratio: 2.5
    max_position_3d_distance: 2.0
    min_class_similarity: 0.50
    min_match_score: 0.25
    min_ambiguous_score: 0.20
    ambiguity_margin: 0.08
    max_identity_candidates: 3
    allow_class_mismatch: false
    time_decay_frames: 12.0
    weights: {class: 0.10, bbox_iou: 0.30, mask_iou: 0.20, position_3d: 0.20, appearance: 0.15, time: 0.05}
  ground_contact_centers: true     # 动态物体的 xz 用掩码最低点与地面的交点（对地面上的小物体比深度稳）
  motion:
    infer_articulation: false  # 从配准的逐步变换里推铰链轴和滑轨行程。默认关着：
                               # 四十条有真值的合成片段上扫过阈值，最好一档的可用率
                               # （报出来的里既是真关节、类型也判对的比例）只有 0.333，
                               # 再收紧就一个都报不出来。见 scripts/sweep_articulation.py
    use_static_detector: false # 用每步修正量判静止。默认关着：实测在真值静止的物体上
                               # 一次都没触发，却在 5.4% 的运动物体上误触发。静止物体
                               # 每步位移是对角线的 0.165、运动物体 0.179，两条分布重合，
                               # 没有可用的阈值。见 probe_motion_signal.py --mode register
    use_registration: true   # 运动估计用跨帧配准的轨迹，而不是包围盒中心序列。
                             # 实测位移误差 0.253 -> 0.188 m；静止物体漂移目前反而略大，
                             # 所以留了开关。见 scripts/probe_motion_signal.py --mode register                         # 世界坐标多假设估计；证据、残差、置信度阈值
    min_support_frames: 5
    min_temporal_span_s: 0.75
    max_missing_fraction: 0.50
    min_mean_visible_fraction: 0.50
    max_gap_factor: 4.0
    min_primary_confidence: 0.55
    min_candidate_confidence: 0.15
    min_hypothesis_margin: 0.10
    static_pos_thresh_m: 0.05
    static_rot_thresh_deg: 3.0
    translation_min_displacement_m: 0.08
    translation_residual_frac: 0.12
    rotation_min_angle_deg: 12.0
    rotation_residual_deg: 5.0
    revolute_min_radius_m: 0.10
    revolute_residual_frac: 0.12
    periodic_min_cycles: 1.5
    periodic_min_period_s: 0.25
    periodic_min_samples_per_cycle: 4.0
    periodic_min_r2: 0.70
    periodic_frequency_steps: 160
    revolute_axis_stability: 0.9
    smooth_window: 5
    static_pos_frac_of_size: 0.3    # 位移小于物体对角线的 30% 视为静止（可见表面质心随相机漂移）
    yaw_min_aspect_ratio: 1.3       # 足迹接近正方形时不信任朝向
  contact_dist_m: 0.08
  ground_ransac_thresh_m: 0.03
  far_depth_factor: 3.0            # 丢弃深度 > 3×中位深度的点（天空、远景）
  assumed_camera_height_m: 1.2     # 相对尺度后端的定标假设
  static_classes: [wall, floor, ground, table, track, rail, belt, conveyor, road, shelf, counter, desk, lawn, grass, carpet, mat, base]
evidence_quality:                 # 实测覆盖与歧义门禁；信息不足默认 warning
  min_object_observation_coverage: 0.20
  min_bbox_coverage: 0.70
  min_mask_coverage: 0.70
  min_depth_coverage: 0.50
  min_visibility_coverage: 0.25
  max_track_gap_frames: 3
  min_object_temporal_span_ratio: 0.20
  min_camera_frame_coverage: 0.50
  min_camera_temporal_span_ratio: 0.70
  max_attribute_unknown_ratio: 0.50
  max_identity_ambiguity: 0.80
  min_motion_support: 0.40
  severe_occlusion_visible_fraction: 0.20
  max_severe_occlusion_fraction: 0.50
candidate_repair:                 # 安全几何修复；默认关闭
  mode: "off"                      # off | report | apply；默认不改变现有流水线
  max_passes: 3
  max_quaternion_norm_delta: 0.02
  max_contact_shift_m: 0.12
  max_evidence_position_error_m: 0.10
  min_contact_confidence: 0.80
  min_geometry_confidence: 0.80
  min_support_overlap_fraction: 0.50
  max_support_tilt_deg: 2.0
vlm:
  provider: openai_compat          # openai_compat | mock
  provider_kind: openrouter        # openrouter | vllm | openai  （决定发送哪些提供商特有参数）
  endpoint: https://openrouter.ai/api/v1
  api_key_file: .secrets/openrouter.key   # 相对仓库根目录；不入 git
  model: z-ai/glm-4.6v             # 约 106B（A12B）的视觉模型，$0.30 / $0.90 每百万 token；备选见 configs/openrouter_*.yaml
  temperature: 0.4
  seed: null                       # 固定它可让同一配置多次运行可比；--seed 覆盖本项
  top_p: 0.9
  max_tokens: 6000
  reasoning: {enabled: false}      # GLM-4.6V 默认会思考并占满 max_tokens；关闭（OpenRouter 统一参数）
  timeout_s: 600
  max_retries: 3
  max_image_side: 768
  json_schema_response_format: true
writer:
  stages: [camera_static, objects, motion]   # 或 single_stage 消融
  repair_attempts: 3
  candidates: 2
  use_evidence: true
assets:
  # CC0 资产库（Kenney 镜像，4812 个 GLB）。没有这个目录就整条退回基本体，管线照常跑。
  library: /project/aip-zhouyang/jwj/GameWorldModel/deps/assets_src/kenney
  min_score: 0.45          # 检索命中分低于这个值就退回基本体：塞一个不相干的网格比放个盒子更糟
  image_weight: 0.6          # 图像分数在融合里的权重；只有文字时退回纯文字
  candidates: 3            # 清单里记几个候选，便于复核检索质量
  enabled: true
feedback:
  rounds: 2
  max_rounds: 3
  render_width: 640
  render_height: 360
  passes: [rgb, id]        # depth 目前没有参与打分，需要时再加回来
  thresholds:
    iou_fail: 0.5
    centroid_px_frac_fail: 0.05
    ate_m_fail: 0.5
  weights: {iou: 0.5, centroid: 0.2, ate: 0.15, dino: 0.15}
  min_improvement: 0.01
render_validation:
  mode: report                    # report | enforce；默认只记录诊断，不修改 Program
  min_frames: 2
  time_tolerance_s: 0.005
  min_rgb_spatial_range: 2
  min_depth_spatial_range: 1
  min_id_spatial_range: 1
  min_object_pixels: 4
  max_unknown_id_fraction: 0.05
  min_motion_frames: 2
  min_motion_span_s: 0.05
  min_translation_m: 0.01
  min_rotation_deg: 1.0
  max_browser_events_per_code: 10
  sample_frames: 5
binding:
  template: platformer_3p
  # 危险物还是靠关键词，因为「这东西危险吗」本质是语义判断，光看尺寸形状推不出来。
  # 收集物、平台、障碍改成按属性推断了，见 gwm/binding/affordance.py。
  affordance:
    hazard_keywords: [lava, spike, water, fire, acid, 熔岩, 尖刺, 岩浆]
  # 内核那边仍然用类名判定（kernel_config），暂时保留这两份词表
  collectible_classes: [coin, gem, key, star, pickup, ball, marble]
  hazard_classes: [lava, spike, water, fire, acid]
  add_ground_if_missing: true
  ground_margin_m: 3.0
  target_ground_extent_m: 24.0     # 游戏尺度归一化：最大静态足迹的长边缩放到这个长度
  lift_objects_to_ground: true
playtest:
  seconds: 90
  shot_every_s: 0.5
  vlm_review: true
budget:
  max_vlm_calls: 40        # 超过就停，防止某条片段把预算耗光
ablations:
  no_evidence: false
  no_feedback: false
  single_stage: false
gt_evaluation:
  # Minimum supported duration fraction, independently for full and holdout windows.
  min_time_coverage: 0.9
