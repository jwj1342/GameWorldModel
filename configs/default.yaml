# 通用默认配置。所有选型与阈值都在这里，代码里不写魔法数。
frames:
  sample_fps: 4            # 抽帧率
  max_seconds: 60
  keyframes: 12            # 送给 VLM 的关键帧数
  keyframe_max_side: 768   # 关键帧长边像素
  geometry_frames: 48      # 几何后端使用的帧数上限
  geometry_width: 518      # VGGT 输入宽
perception:
  geometry_backend: vggt          # vggt | static | gt（ViPE 与 SAM 3.1 见 docs/status.md 的待办）
  geometry_fallbacks: [static]
  segmentation_backend: grounded_sam2   # grounded_sam2 | gt
  segmentation_fallbacks: [none]   # 检测器崩了也要出包，退化成只有静态结构的场景
  max_objects: 8
  # 被看到的帧数低于这个比例的轨迹直接丢掉。
  #
  # **2026-10-19 从 0.0 改成 0.30**，扫了 0.0 / 0.10 / 0.20 / 0.30 四档，十二条片段。
  # 这是这一轮唯一真正推动了精细度的改动。
  #
  #   汇总（把各片段的计数加起来再算，不是片段级中位）：
  #     物体精确率  0.214 -> 0.247 -> 0.300   四档单调
  #     场景精确率  0.285 -> 0.307 -> 0.389   四档单调
  #     物体召回    0.407 -> 0.373 -> 0.356
  #     预测物体数  112 -> 89 -> 70
  #     轨迹误差    0.256 -> 0.238 -> 0.209
  #     尺度中位    1.37 -> 1.46 -> 1.10（1.0 最好）
  #     可交互性    0.929 -> 0.921 -> 0.943（0.30 是四档里最高的）
  #
  #   **逐片段配对**（同一条片段两臂比，消掉片段难度的差异，比合计值可信）：
  #     场景精确率  8 赢 / 2 输 / 2 平
  #     物体精确率  5 赢 / 2 输 / 5 平
  #     物体召回    0 赢 / 3 输 / 9 平   —— 召回只在三条片段上掉，九条没动
  #
  # 代价是实在的：**召回从 0.407 掉到 0.356**，配对物体 24 -> 21。换来的是预测数
  # 几乎砍半（112 -> 70）。用户定的优先级是「先把物体精确率拉起来」，这个取舍符合它。
  #
  # 两个口径说明，免得以后被误读：
  #   一、主表那几列是**片段级中位**，在 0.20 那一档看着非单调；上面的汇总是把计数
  #       加起来算的，四档单调。非单调是中位数这个汇总方式带来的，不是信号本身抖。
  #   二、0.30 是扫过的四档里最好的一档，**更大的值没扫过**。它是单调趋势的末端，
  #       不是中间的一个凸起，所以不算挑樱桃；但再往上要重新量。
  #
  # **独立留出集确认过了**（`hold015`：同样 stage-scale 0.15，换种子 20261220，
  # 十二条**全新场景**，和 ab015 没有一条内容相同；真值相机高度中位 1.03、
  # 范围 0.60–3.72，和 ab015 的 1.05 / 0.62–3.89 对得上，确属同一取景约定）。
  # 这批**没有参与调参**：
  #
  #     物体精确率  0.153 -> 0.244   逐片段 7 赢 / 2 输 / 2 平
  #     场景精确率  0.264 -> 0.382   逐片段 9 赢 / 1 输 / 1 平
  #     物体召回    0.271 -> 0.229   逐片段 0 赢 / 2 输 / 9 平
  #     预测物体数  85 -> 45
  #     形状对      0.692 -> 0.818
  #     可交互性    0.894 -> 0.933
  #
  # 留出集上的赢面比调参那一批**还大**（场景精确率 9/1/1 对 8/2/2），所以这不是
  # 过拟合。召回的代价两批一致：逐片段只在两三条上掉，其余不动。
  #
  # **上面这些数是在带真值 bug 的批次上量的**（`--stage-scale` 没缩轨迹关键帧，
  # ab015 的 5 个轨迹物体全坏，见 #5）。修完真值重造 `ab015fix` 之后重跑，
  # 结论方向不变、绝对值略好：
  #
  #     frac=0.0    配对 24 -> 25   召回 0.407 -> 0.424   精确率 0.214 -> 0.243
  #     frac=0.30   配对 21 -> 21   召回 0.356 -> 0.356   精确率 0.300 -> 0.333
  #
  # 两档精确率都涨约三个点。机制不只是「标注对了」——坏的关键帧让**渲出来的视频里
  # 物体飞出场景**，修完之后视频本身也变了，检测器少报了一批（112->103、70->63）。
  # 当前最好的配置在修好的真值上是 **召回 0.356、精确率 0.333**。
  #
  # **留出集也用修好的真值重验过了**（`hold015fix`，原批次 2/2 轨迹物体坏）：
  #
  #     物体精确率  0.173 -> 0.233    逐片段 6 赢 / 3 输 / 2 平
  #     场景精确率  0.252 -> 0.348    逐片段 8 赢 / 2 输 / 1 平
  #     物体召回    0.292 -> 0.208    逐片段 0 赢 / 3 输 / 8 平
  #
  # 结论在修好的数据上**仍然成立**（场景精确率逐片段 8/2/1），但**召回的代价比在
  # 坏数据上量到的更大**：原来是 0.271 -> 0.229（-15%），现在是 0.292 -> 0.208
  # （-29%）。所以这个取舍比我之前报的更贵，要回退就把值调回 0.0 或 0.10。
  # 按名次的保底：不管上面那个阈值怎么说，每条片段**最长的这几条轨迹永远留下**。
  # 阈值是全局的，一条片段里要是所有轨迹都短就会被整条清空（实测有片段 2 个物体
  # 掉到 0 个），而召回的损失正集中在这种片段上。名次是片段内相对的，所以不会出现
  # 「恰好都短就一个不剩」。0 表示没有保底。
  #
  # **扫过了，是个彻底的 no-op，所以保持 0。** 0 和 2 两臂每一个指标一模一样，
  # 丢掉的轨迹数都是 75——因为最长的那几条本来就过阈值，保底保的全是已经安全的。
  #
  # 当初加它的前提是错的：以为召回的损失来自「全局阈值把整条片段清空」。实际查下来，
  # 产出 0 个物体的那几条片段根本不是被这个阈值清空的——test_00000 是世界对齐退化
  # （标定倍数 15.62）导致物体全陷到地下、被陷地闸丢掉 15 个；另外两条是两个物体都
  # 被判成了结构件。开关留着是因为它无害，但别指望它能救召回。
  min_track_keep: 0

  min_track_frame_frac: 0.30
                             # 只被看到几帧的轨迹基本是噪声（运动估计成功率 0%），
                             # 而它们把物体精确率压得很低。合适的值用小批量真值指标定。
  color_min_pixels: 4             # 最少实测像素；缺图/缺mask时不猜颜色
  color_aspect_tolerance: 0.02     # 相对长宽比容差，允许几何模型patch尺寸取整
  grounding_box_threshold: 0.25
  grounding_text_threshold: 0.2
  detection_keyframes: 6          # 在 6 个均匀关键帧上检测后关联。实测这是召回最大的杠杆：
                                  # 同一段视频 1 帧检出 9 个物体、画面覆盖 0.23，6 帧检出 62 个、
                                  # 覆盖 0.53，代价是感知从 50 秒涨到 108 秒。再降阈值能到 0.78，
                                  # 但资产命中率从 0.74 掉到 0.58（检出一堆对不上类别的东西），
                                  # 耗时翻到 241 秒，所以阈值保持不动。
  association:                    # 类别／重叠／空间／时间关联；保留身份候选
    max_frame_gap: 24
    max_bbox_center_distance_ratio: 2.5
    max_position_3d_distance: 2.0
    min_class_similarity: 0.50
    min_match_score: 0.25
    min_ambiguous_score: 0.20
    ambiguity_margin: 0.08
    max_identity_candidates: 3
    allow_class_mismatch: false
    time_decay_frames: 12.0
    weights: {class: 0.10, bbox_iou: 0.30, mask_iou: 0.20, position_3d: 0.20, appearance: 0.15, time: 0.05}
  ground_contact_centers: true     # 动态物体的 xz 用掩码最低点与地面的交点（对地面上的小物体比深度稳）
  motion:
    # 默认关着。**根因是 #7 那个 ICP 伪造转动，不是阈值没调好**：静止物体被 ICP
    # 解出 26.6° 的转动（合成对照），而这里铰链的门槛是 8°，实测触发时的转角中位数
    # 是 22.4°/37.8°/76.5°。全真值几何 + 全真值分割下 12 个真关节也只找回 1 个
    # ——完美的掩码和深度不会让 ICP 不伪造转动。详见 gwm/perception/registration.py
    # 里 infer_articulation 上面那段注释和 #63。
    infer_articulation: false  # 从配准的逐步变换里推铰链轴和滑轨行程。原来的说明：
                               # 四十条有真值的合成片段上扫过阈值，最好一档的可用率
                               # （报出来的里既是真关节、类型也判对的比例）只有 0.333，
                               # 再收紧就一个都报不出来。见 scripts/sweep_articulation.py
    use_static_detector: false # 用每步修正量判静止。默认关着：实测在真值静止的物体上
                               # 一次都没触发，却在 5.4% 的运动物体上误触发。静止物体
                               # 每步位移是对角线的 0.165、运动物体 0.179，两条分布重合，
                               # 没有可用的阈值。见 probe_motion_signal.py --mode register
    registration_smooth_window: 15 # 配准轨迹的时间平滑窗口。实测 9 和 15 的轨迹误差一样
                                   # （0.140），但 15 把静止物体的漂移从 0.231 压到 0.084，
                                   # 反超包围盒中心的 0.170。见 probe_motion_signal --mode register
    use_registration: true   # 运动估计用跨帧配准的轨迹，而不是包围盒中心序列。
                             # 实测位移误差 0.253 -> 0.188 m；静止物体漂移目前反而略大，
                             # 所以留了开关。见 scripts/probe_motion_signal.py --mode register                         # 世界坐标多假设估计；证据、残差、置信度阈值
    min_support_frames: 5
    min_temporal_span_s: 0.75
    max_missing_fraction: 0.50
    min_mean_visible_fraction: 0.50
    max_gap_factor: 4.0
    min_primary_confidence: 0.55
    min_candidate_confidence: 0.15
    min_hypothesis_margin: 0.10
    static_pos_thresh_m: 0.05
    static_rot_thresh_deg: 3.0
    translation_min_displacement_m: 0.08
    translation_residual_frac: 0.12
    rotation_min_angle_deg: 12.0
    rotation_residual_deg: 5.0
    revolute_min_radius_m: 0.10
    revolute_residual_frac: 0.12
    periodic_min_cycles: 1.5
    periodic_min_period_s: 0.25
    periodic_min_samples_per_cycle: 4.0
    periodic_min_r2: 0.70
    periodic_frequency_steps: 160
    revolute_axis_stability: 0.9
    smooth_window: 5
    static_pos_frac_of_size: 0.3    # 位移小于物体对角线的 30% 视为静止（可见表面质心随相机漂移）
    yaw_min_aspect_ratio: 1.3       # 足迹接近正方形时不信任朝向
    # 朝向序列接连续时，允许消掉 90 度（长短轴互换）这重规范自由度的足迹比上限。
    # 比它更细长的形状，直角转动是真的，只消 180 度（特征向量符号）那一重。
    # 实测依据见 #7：真值静止的物体里，足迹比 1.2–1.5 那一档 yaw 跨度中位 73.5 度，
    # 2.5 以上只有 5.1 度；但真会转的物体也挤在 1.5–2.5，所以这条线压在 1.6。
    yaw_square_below: 1.6
  contact_dist_m: 0.08
  ground_ransac_thresh_m: 0.03
  far_depth_factor: 3.0            # 丢弃深度 > 3×中位深度的点（天空、远景）
  assumed_camera_height_m: 1.2     # 相对尺度后端的定标假设
  # 地平面候选里，相机高度低于「候选中位高度 × 这个比例」的判为「平面压在相机上」，
  # 丢掉再挑。原来对相机高度只有 cam_height > 0 这一条，太松——实测有候选只有
  # 0.035，而选择打分只看内点数，贴着相机的面往往内点最多，于是必然选错。后果不是
  # 尺度估偏：地面错了一个单位，再乘上为了凑 1.2 米解出的十几倍，物体落到地下
  # 二十多米被 dropped_sunk 丢光，整条片段产出零个物体（#84）。
  #
  # 阈值是**无量纲**的，拿候选自己的中位数当标尺——重建是相对尺度，绝对米制阈值
  # 在这里没有意义。实测 24 条片段上 0.25 恰好改动那 3 条诊断亮了的，其余 21 条
  # 一条不动；「相对单位 ÷ 真值相机高度」这个本该在片段间一致的比值，极差从
  # 24.9 倍收到 6.0 倍。0.15 只修得动 2 条（极差还剩 20.0 倍），0.35 和 0.25 等效。
  ground_plane_min_height_ratio: 0.25
  # 包围盒定边界时两端各切掉多少百分位。历史值 3（也就是 3/97），切两端是为了抗深度
  # 离群点——但实测它吃掉的比离群点多得多，是「重建出来的物体偏小」的主因：
  # 同一批跨帧汇聚的点只换这一个参数，最长边中位 3/97→1.000、1/99→1.130、0/100→1.321，
  # 而「跨帧汇聚 vs 逐帧」只有 1.084。长维度被截断到真值的 0.70、补平需要 1.43——
  # 这一个参数就够，汇聚远远不够。默认先不动，等完整管线 A/B 有结果再定。
  obb_extent_percentile: 3.0
  detect_per_phrase: false   # 逐短语分别检测，而不是把所有类名拼成一串问一次。
                             # 拼串的两个毛病：一个框落在多个短语的词上时返回的是拼接
                             # （#67 修的词片碎屑就是这么来的），而且短语之间会争夺同一
                             # 个框。代价是每帧多跑 N 次前向（模型只加载一次，线性增长）。
                             # 默认关着，因为效果还没量过——过检那 62% 的无中生有，七个
                             # 判别子全排除之后，换检测是仅剩的方向之一，见 #56。
  detect_per_phrase_iou: 0.6 # 跨短语合并的重叠阈值：同一个物体可能被 crate 和 box 都找到
  static_classes: [wall, floor, ground, table, track, rail, belt, conveyor, road, shelf, counter, desk, lawn, grass, carpet, mat, base]
evidence_quality:                 # 实测覆盖与歧义门禁；信息不足默认 warning
  min_object_observation_coverage: 0.20
  min_bbox_coverage: 0.70
  min_mask_coverage: 0.70
  min_depth_coverage: 0.50
  min_visibility_coverage: 0.25
  max_track_gap_frames: 3
  min_object_temporal_span_ratio: 0.20
  min_camera_frame_coverage: 0.50
  min_camera_temporal_span_ratio: 0.70
  max_attribute_unknown_ratio: 0.50
  max_identity_ambiguity: 0.80
  min_motion_support: 0.40
  severe_occlusion_visible_fraction: 0.20
  max_severe_occlusion_fraction: 0.50
candidate_repair:                 # 安全几何修复；默认关闭
  mode: "off"                      # off | report | apply；默认不改变现有流水线
  max_passes: 3
  max_quaternion_norm_delta: 0.02
  max_contact_shift_m: 0.12
  max_evidence_position_error_m: 0.10
  min_contact_confidence: 0.80
  min_geometry_confidence: 0.80
  min_support_overlap_fraction: 0.50
  max_support_tilt_deg: 2.0
vlm:
  provider: openai_compat          # openai_compat | mock
  provider_kind: openrouter        # openrouter | vllm | openai  （决定发送哪些提供商特有参数）
  endpoint: https://openrouter.ai/api/v1
  api_key_file: .secrets/openrouter.key   # 相对仓库根目录；不入 git
  model: z-ai/glm-4.6v             # 约 106B（A12B）的视觉模型，$0.30 / $0.90 每百万 token；备选见 configs/openrouter_*.yaml
  temperature: 0.4
  seed: null                       # 固定它可让同一配置多次运行可比；--seed 覆盖本项
  top_p: 0.9
  max_tokens: 6000
  reasoning: {enabled: false}      # GLM-4.6V 默认会思考并占满 max_tokens；关闭（OpenRouter 统一参数）
  timeout_s: 600
  max_retries: 3
  max_image_side: 768
  json_schema_response_format: true
writer:
  stages: [camera_static, objects, motion]   # 或 single_stage 消融
  repair_attempts: 3
  candidates: 2
  use_evidence: true
assets:
  # CC0 资产库（Kenney 镜像，4812 个 GLB）。没有这个目录就整条退回基本体，管线照常跑。
  library: /project/aip-zhouyang/jwj/GameWorldModel/deps/assets_src/kenney
  min_score: 0.45          # 检索命中分低于这个值就退回基本体：塞一个不相干的网格比放个盒子更糟
  image_weight: 0.6          # 图像分数在融合里的权重；只有文字时退回纯文字
  candidates: 3            # 清单里记几个候选，便于复核检索质量
  enabled: true
synthesis:
  size_regularisation: false   # 把偏离先验太远的物体按先验缩回去。默认关着：三条真实
                               # 视频上用重渲染相似度做过消融，plarail 上开着 0.281、
                               # 关着 0.473，是整张消融表里最大的单项效应。缩物体却不
                               # 改相机距离，取景就变了——度量更对，画面更不像。
  colour_fit_rounds: 4         # 按闭环残差把材质颜色调几轮。0 关掉。渲出来比视频暗，
                               # 因为把像素中位数当反照率写进材质、渲染时又乘了一遍光照。
                               # 逐轮扫过（亮度比，目标 1.0）：
                               #   合成 0.883 -> 0.953 -> 0.986 -> 0.993 -> 1.000
                               #   合成 0.802 -> 0.910 -> 0.968 -> 1.000 -> 1.000
                               #   真实 0.646 -> 0.749 -> 0.871 -> 0.930 -> 0.953
                               #   真实 0.608 -> 0.902 -> 0.924 -> 0.924（第三轮起到平台）
                               # 合成片段第四轮精确收敛到 1.000，所以取 4；两轮只到 0.971。
                               # 真实视频第五轮还在爬，但增量已经很小，而代价线性增长
                               # （每轮一次渲染加一次编译，约 6 秒）。
                               # 那个 0.924 的平台是单物体一个标量增益修不掉的——带纹理
                               # 的物体各处颜色不同，逐面或逐区域的修正是下一步，见 #55。
                               # 见 gwm/feedback/colour.py
  dedup_relative_distance: 0.5 # 同类物体中心距离除以两者对角线的平均值，小于这个数就当成
                               # 重复检出合掉。0 关掉。实测没配上真值的预测物体里 38% 离
                               # 最近的真阳性不到一个物体尺度（#56），那些是同一个东西被
                               # 检出两遍。十一条片段上扫过：0 / 0.3 / 0.5 / 0.7 的精确率是
                               # 0.173 / 0.182 / 0.202 / 0.214，召回 0.500 / 0.481 / 0.481 /
                               # 0.462，F1 0.257 / 0.265 / 0.284 / 0.293。取 0.5 是因为再往上
                               # 召回掉得明显——堆叠和紧挨的物体本来就该是两个。
                               # 见 scripts/sweep_dedup.py
  # 判不出运动模型但判得出它在动时，把**观测到的轨迹**原样写进程序
  # （可交互性第一档「观测运动」）。**默认关着**，原因见下。
  #
  # 在**真值感知**上这是个明确的改进（十条片段）：
  #   场景里写了运动的物体 14/77 -> 44/77，会动查全 0.136 -> 0.750，
  #   而且物体召回 0.586 -> 0.646、精确率 0.333 -> 0.375 跟着涨
  #   （把会动的写成静止会让它配不上，它们真动了就配上了）。
  #
  # 但在**神经感知**上是净亏（十二条片段，同一份代码只差这一个开关）：
  #   会动查全 0.167 -> 0.500（涨了三倍，这一条是真的）
  #   命中率相对瞎猜 +0.250 -> +0.036（优势基本没了）
  #   物体召回 0.500 -> 0.429、精确率 0.218 -> 0.207（都降了）
  #   实测可交互性 0.911 -> 0.821（降了）
  #   运动类型准确率相对「恒答 static」 +0.000 -> -0.087
  #
  # 差别在轨迹质量：真值感知的观测轨迹够准，写进去是对的；神经感知的轨迹带噪声，
  # 写进去等于给静止物体加上抖动，于是配不上、也拖不动——被轨迹动画驱动的物体
  # 不跟鼠标走，第一档和第二档在这里是打架的。
  #
  # 要打开它，先要么把神经轨迹做准，要么找到一道**逐物体的质量闸**。
  # 第一个候选（配准残差 registration.rmse_over_diagonal）已经量过，**不成立**：
  # 真会动的残差中位 0.0201、误报的只有 0.0142——误报反而更小，因为静止物体的点云
  # 自己跟自己配得特别好。残差量的是「ICP 收敛没有」，不是「这条轨迹是不是真的」。
  # 按它设闸只会留下更多误报（阈值 0.020 时命中率 0.865 -> 0.842）。
  write_observed_motion: false
  # 打开之后，位移超过自身对角线这个比例才写。实测（57 个 moves=True 的物体）：
  # 真会动的位移合自身对角线 1.71 倍，误报的只有 0.23 倍，四分位几乎不重叠。
  # 0.4 这一档命中率 0.868、查全 0.805；不设闸是 0.649 / 0.902。
  # 用相对量不用绝对米数：绝对阈值不是尺度不变的，这个坑踩过两次。
  observed_motion_min_span_frac: 0.4
  # 把排成一条线的同类小碎块合成一个长条。真值里一根轨道是 6.4 比 1 的长条，
  # 而掩码只覆盖它的一小段，于是一根轨道被切成好几块、每块都成了独立「物体」。
  # 实测（十一条片段）：落在真值 static 上的 25 个检出只对应 11 个真值结构件，
  # 平均 2.27 次、一个被切成 6 块，碎片尺寸中位只有真值的 0.208（见 #56）。
  #
  # merge_duplicates 碰不到它们：碎片沿轨道排开，相对距离远超它的 0.5 阈值
  # （同类对的相对距离中位是 2.76），而把那个阈值调大会把真正挨近的不同物体并掉。
  # 所以这里用另一个维度：**共线 + 细长**。三个条件缺一不可，第三个是安全阀——
  # 三个堆叠的箱子也会连通，但合出来是方的不是长条，所以不合。
  #
  # 两个前提第一版设错了，量完才改（八组真碎片上）：
  #   按类名分组  只有 3/8 的组类名一致——同一根地面的 6 块被贴了 lava 和 pod
  #               两个名字，而这个数据集的类名本来就无意义。默认关掉。
  #   min_chain=3 只有 3/8 的组有三块以上，五组是两块。降到 2。
  # 实测间距中位 0.68 个对角线，所以 2.5 是宽松的，22 个碎片里 17 个能连上。
  # **默认关着**：单变量对照（同一快照、只切这个开关、十二条片段）上它是净亏的。
  #   配对物体 24 -> 17   召回 0.464 -> 0.268   精确率 0.226 -> 0.200
  #   可交互性 0.884 -> 0.802
  # 而且它确实执行了（三条片段各合掉 10、4、14 个节点），所以不是没生效，是生效了
  # 并且有害。
  #
  # 机制：**连通分量没有长度上限**。碎片本身很小（尺寸中位只有真值的 0.208），
  # 小物体的对角线小，2.5 倍对角线是个很短的绝对距离——但只要场景里有一排小东西，
  # 它们就会一个接一个连通成链，一条链吞掉 10 个节点（真碎片组平均只有 2.27 块、
  # 最大一组 6 块）。而 min_elongation 挡不住：串得越长越细长，这个条件反而**鼓励**
  # 长链。
  #
  # 这不是调阈值能救的：把 max_gap 调小会让真碎片也连不上（实测碎片间距中位 0.68
  # 个对角线，而真物体之间也可能是这个量级）。判据本身有结构缺陷——要修得给链加
  # 长度上限、或者换一个不靠连通分量的分组方式。代码和开关留着，等想清楚再开。
  # 结构件的位置取首帧包围盒中心，不取逐帧中位。逐帧中心在整段视频里**单调漂移**
  # （拿位置恒定的真值结构件量，逐帧误差中位 0.366 -> 0.419 -> 0.511 -> 0.578 米），
  # 取中位是把估计往漂移里拖。四种估计量的对照见 gwm/synthesis/direct.py 的注释。
  #
  # 单变量 A/B（同一节点、同一批十二条片段、只切这个开关）的实际效果比预期小得多：
  #   可交互性   0.884 -> 0.929   （点得到 89 -> 93，真拖得动 99 -> 104）
  #   场景召回/精确率、物体召回/精确率、配对物体数   **一个都没动**
  #   形状对 0.667 -> 0.625（24 个配对里差一个，是噪声）
  #
  # 为什么预期落空：那个 0.277 对 0.458 的对照是在「配上真值结构件的节点」上量的，
  # 而这条链路把 16 个里的 15 个都写进了 objects——**它们走的是另一个分支，那个分支
  # 本来就用首帧**。这里改的只是真正进了 static 的那二十来个节点，population 太小，
  # 推不动按片段汇总的召回和精确率。开着是因为它有根据而且可交互性确实涨了，
  # 但要让这个改动真正起作用，得先解决「结构件被归进 objects」那个缺口。
  structure_pos_first_frame: true

  merge_fragment_chains: false
  fragment_max_gap_diagonals: 2.5   # 只连相邻的
  fragment_min_chain: 2             # 安全阀是细长那条，不是块数
  fragment_min_elongation: 3.0      # 合出来必须细长，否则是一堆挤在一起的东西
  fragment_same_class_only: false   # 碎片的类名不一致，按类名分组会拆散它们
  separate_seconds: 1.5        # 重力稳定之前先跑多久的纯分离（不开重力，只把互相插着的
                               # 顶开）。重力解不开横向咬住的物体——它没有把它们分开的
                               # 方向可用。实测拖不动的物体插入深度中位数是拖得动的近六十
                               # 倍，这一刀把实测可交互性从 0.771 提到 0.803，插超 1 cm
                               # 的比例 0.354 -> 0.289。0/0.5/1.5/3.0 里 1.5 最好，3.0
                               # 反而略降。见 scripts/sweep_separation.py
  max_object_area_frac: 0.35   # 掩码占画面超过这个比例的检测按结构件处理，不进 objects。
                               # 实测检出过占画面 67% 的「slab」，而真值里最大的物体只占
                               # 2.1%——那种东西会变成一块和场景一样大的可拖动板子。
feedback:
  rounds: 2
  max_rounds: 3
  render_width: 640
  render_height: 360
  passes: [rgb, id]        # depth 目前没有参与打分，需要时再加回来
  thresholds:
    iou_fail: 0.5
    centroid_px_frac_fail: 0.05
    ate_m_fail: 0.5
  weights: {iou: 0.5, centroid: 0.2, ate: 0.15, dino: 0.15}
  min_improvement: 0.01
render_validation:
  mode: report                    # report | enforce；默认只记录诊断，不修改 Program
  min_frames: 2
  time_tolerance_s: 0.005
  min_rgb_spatial_range: 2
  min_depth_spatial_range: 1
  min_id_spatial_range: 1
  min_object_pixels: 4
  max_unknown_id_fraction: 0.05
  min_motion_frames: 2
  min_motion_span_s: 0.05
  min_translation_m: 0.01
  min_rotation_deg: 1.0
  max_browser_events_per_code: 10
  sample_frames: 5
binding:
  template: platformer_3p
  # 危险物还是靠关键词，因为「这东西危险吗」本质是语义判断，光看尺寸形状推不出来。
  # 收集物、平台、障碍改成按属性推断了，见 gwm/binding/affordance.py。
  affordance:
    hazard_keywords: [lava, spike, water, fire, acid, 熔岩, 尖刺, 岩浆]
  # 内核那边仍然用类名判定（kernel_config），暂时保留这两份词表
  collectible_classes: [coin, gem, key, star, pickup, ball, marble]
  hazard_classes: [lava, spike, water, fire, acid]
  add_ground_if_missing: true
  ground_margin_m: 3.0
  target_ground_extent_m: 24.0     # 游戏尺度归一化：最大静态足迹的长边缩放到这个长度
  lift_objects_to_ground: true
playtest:
  seconds: 90
  shot_every_s: 0.5
  vlm_review: true
budget:
  max_vlm_calls: 40        # 超过就停，防止某条片段把预算耗光
ablations:
  no_evidence: false
  no_feedback: false
  single_stage: false
gt_evaluation:
  # Minimum supported duration fraction, independently for full and holdout windows.
  min_time_coverage: 0.9
