# 几何用真值（相机 + 深度），分割仍走神经感知。
#
# 这一档隔离「深度」这一维。和它并排的三档（见 #7）：
#   全神经                 运动类型准确率 0.000
#   只有相机是真值         0.000  ← 相机不是主因
#   几何全真 + 神经掩码     这一档
#   全真                   0.277
# 这一档和全神经的差，就是深度贡献的；和全真的差，就是掩码贡献的。
#
# 真值深度是从真值相机渲出来的，所以深度和相机必须一起换——配神经相机不自洽。
perception:
  geometry_backend: gt
  geometry_fallbacks: []
  gt_program: ""
