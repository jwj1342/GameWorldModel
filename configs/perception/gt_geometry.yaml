# 几何用真值（相机 + 深度），分割仍走神经感知。
#
# 这一档隔离「深度」这一维。和它并排的三档（见 #7）：
#   全神经                 运动类型准确率 0.182（10 条片段、22 个配对物体）
#   只有相机是真值         0.158（8 条、19 个）   ← 相机不是主因
#   几何全真 + 神经掩码     0.200（10 条、25 个）  ← 深度也不是
#   全真（再加真值掩码）    见 #7
#
# 三档都是二十上下个物体，标准误约 0.09，彼此的差完全落在噪声里。
# （这四个数原先全记成 0.000，那是汇总表把 0/1 序列印中位数印出来的假象。）
# 这一档和全神经的差，就是深度贡献的；和全真的差，就是掩码贡献的。
#
# 真值深度是从真值相机渲出来的，所以深度和相机必须一起换——配神经相机不自洽。
perception:
  geometry_backend: gt
  geometry_fallbacks: []
  gt_program: ""
