# 真值分割 + 真实几何（VGGT）。
#
# 为什么要这一档：残差挑资产的所有数据都是在**全真值感知**上测的（33 个候选挑对
# 0.297、385 个 0.162），而管线跑真实感知，端到端命中率 **0/78**，和按衰减曲线算
# 出的期望（约 5/76）对不上。残差判据比的是**表面细节**，而掩码溢出和深度噪声
# 正好吃掉的就是这个。
#
# 直接换全神经感知验不了：物体 id 会变成检测器的证据 id，和真值资产 ref 对不上，
# 残差那一臂根本不触发。保住真值分割就保住了物体身份，同时把深度换成真实的——
# 这样「残差扛不扛得住真实深度」就被单独隔出来了。
perception:
  segmentation_backend: gt
  segmentation_fallbacks: []      # 清空：退化到 grounded_sam2 会悄悄把关联误差放回来
  geometry_backend: vggt
  geometry_fallbacks: []
